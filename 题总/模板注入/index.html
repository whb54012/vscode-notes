<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 背景图，这里用渐变代替，你可以换成background-image背景图片 */
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
        }

        /* 毛玻璃卡片容器 */
        .login-box {
            width: 380px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .login-box h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .item {
            margin-bottom: 20px;
        }

        .item label {
            display: block;
            color: #ffffffdd;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .item input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .item input::placeholder {
            color: #ffffff80;
        }

        .item input:focus {
            border-color: rgba(255,255,255,0.5);
        }

        button {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: none;
            background-color: rgba(255,255,255,0.25);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: rgba(255,255,255,0.35);
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>账号登录</h2>
    <!-- post提交到 / 路由 -->
    <form method="post">
        <div class="item">
            <label>用户名</label>
            <input type="text" name="username" placeholder="请输入用户名">
        </div>
        <div class="item">
            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码">
        </div>
        <button type="submit">登录</button>
    </form>
</div>
</body>
</html>
